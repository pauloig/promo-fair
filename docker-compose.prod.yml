services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    image: disagro/web:prod
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: disagro/api:prod
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://disagro:disagro@db:5432/disagro}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
      VENTAS_USERNAME: ${VENTAS_USERNAME:-ventas}
      VENTAS_PASSWORD: ${VENTAS_PASSWORD:-cambia-esta-contrasena-en-produccion}
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disagro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disagro}
      POSTGRES_DB: ${POSTGRES_DB:-disagro}
    volumes:
      - pgdata:/var/lib/postgresql/data

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - proxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ ! -d /etc/letsencrypt/live/disagro.endtoendsolutions.dev ]; then
          certbot certonly --webroot -w /var/www/certbot
          --email ${LETSENCRYPT_EMAIL:-paulo.ismalej@gmail.com}
          --agree-tos --no-eff-email -d disagro.endtoendsolutions.dev;
        fi;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h;
        done

volumes:
  pgdata:
  certbot-certs:
  certbot-webroot: