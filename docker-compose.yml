services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://disagro:disagro@db:5432/disagro}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-no-usar-en-produccion}
      VENTAS_USERNAME: ${VENTAS_USERNAME:-ventas}
      VENTAS_PASSWORD: ${VENTAS_PASSWORD:-ventas}
      EVENTO_FECHA_INICIO: ${EVENTO_FECHA_INICIO:-2026-11-21T08:00:00-06:00}
      EVENTO_FECHA_FIN: ${EVENTO_FECHA_FIN:-2026-11-22T18:00:00-06:00}
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disagro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disagro}
      POSTGRES_DB: ${POSTGRES_DB:-disagro}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: