# Producción: puerto 80 responde el reto ACME (http-01) y redirige a HTTPS;
# HTTPS actúa como reverse proxy hacia web/api.
server {
    listen 80;
    server_name disagro.endtoendsolutions.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name disagro.endtoendsolutions.dev;

    ssl_certificate /etc/letsencrypt/live/disagro.endtoendsolutions.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/disagro.endtoendsolutions.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}